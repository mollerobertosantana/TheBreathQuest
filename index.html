<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BreathQuest – Respiratory System Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#2b7de9;--navy:#17407a;--sky:#e6f4ff;--pink:#ff7aa8;--green:#24a865;--red:#e5484d;--yellow:#ffc93c;--ink:#1d2b45;--muted:#5d6b85;--card:#fff;--line:#d6e6f7}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#d7eeff 0%,#f3faff 60%,#fff 100%);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.logo{font-weight:700;font-size:1.35rem;color:var(--navy);display:flex;align-items:center;gap:6px;cursor:pointer;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo span{color:var(--pink)}
.hbtn{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:.95rem;color:var(--navy);font-weight:600}
.hbtn:hover{border-color:var(--blue)}
.lang b{padding:2px 6px;border-radius:999px;color:var(--muted)}
.lang b.on{background:var(--blue);color:#fff}
.total{font-weight:600;color:var(--navy);white-space:nowrap}
main{max-width:1000px;margin:0 auto;padding:18px 14px 60px}
.panel{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 6px 0 #cfe3f7,0 10px 30px rgba(43,125,233,.08);margin-bottom:16px}
.center{text-align:center}
.btn{background:var(--blue);color:#fff;border:none;border-radius:14px;padding:11px 20px;font-size:1.05rem;font-weight:600;box-shadow:0 4px 0 #1b5fb8;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1b5fb8}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--blue);box-shadow:0 4px 0 #cfe3f7}
.btn.pink{background:var(--pink);box-shadow:0 4px 0 #d9567f}
.btn.green{background:var(--green);box-shadow:0 4px 0 #17804b}
.btn.big{font-size:1.2rem;padding:14px 28px}
.btn.sm{font-size:.9rem;padding:7px 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.row.end{justify-content:flex-end}
.guide{display:flex;align-items:flex-end;gap:10px;margin:4px 0 14px}
.guide svg{flex:0 0 auto;animation:bob 3s ease-in-out infinite}
.speech{position:relative;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 16px;font-size:1.05rem;line-height:1.45;flex:1}
.speech:before{content:"";position:absolute;left:-10px;bottom:18px;border:9px solid transparent;border-right-color:var(--line);border-left:0}
.speech:after{content:"";position:absolute;left:-7px;bottom:19px;border:8px solid transparent;border-right-color:#fff;border-left:0}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.hero{background:linear-gradient(135deg,#fff,#eaf6ff);border-radius:26px;padding:18px;margin-bottom:18px;border:2px solid var(--line)}
.hero h1{margin:0 0 6px;color:var(--navy);font-size:clamp(1.6rem,4vw,2.3rem)}
.hero p.sub{margin:0 0 6px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.lvl{text-align:left;background:#fff;border:2px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 5px 0 #cfe3f7;transition:transform .15s,border-color .15s;color:var(--ink)}
.lvl:hover{transform:translateY(-3px);border-color:var(--blue)}
.lvl-top{display:flex;align-items:center;gap:10px}
.lvl-icon{font-size:2rem;width:52px;height:52px;border-radius:16px;background:var(--sky);display:grid;place-items:center}
.lvl-num{font-size:.85rem;color:var(--muted);font-weight:600}
.lvl h3{margin:2px 0 0;font-size:1.2rem;color:var(--navy)}
.lvl p{margin:8px 0;color:var(--muted);font-size:.95rem;line-height:1.35}
.stars{font-size:1.2rem;letter-spacing:2px}
.stars .off,.bigstars .off{filter:grayscale(1);opacity:.3}
.bigstars{font-size:2.6rem;letter-spacing:6px;margin:8px 0}
.hint{color:var(--muted);text-align:center}
.foot{text-align:center;margin-top:22px;color:var(--muted);font-size:.85rem}
.foot button{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:.85rem}
.lhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.lhead h2{margin:0;color:var(--navy);flex:1;font-size:1.45rem}
.pill{background:#fff;border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:600;color:var(--navy);font-size:.95rem}
.bar{height:10px;background:#e8f1fb;border-radius:99px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--pink));border-radius:99px;transition:width .4s}
/* anatomy */
.two{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.svgbox{background:#fff;border-radius:22px;padding:8px;box-shadow:0 6px 0 #cfe3f7}
.svgbox svg{width:100%;height:auto;display:block;max-height:72vh}
.part{cursor:pointer;transition:filter .2s}
.part:hover{filter:drop-shadow(0 0 5px #2b7de9)}
.part.found{filter:drop-shadow(0 0 5px #24a865) drop-shadow(0 0 3px #24a865)}
.part.wrong{filter:drop-shadow(0 0 6px #e5484d) drop-shadow(0 0 4px #e5484d)}
.part.hint{animation:glow 1s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 2px #ffc93c)}50%{filter:drop-shadow(0 0 9px #ffb400) drop-shadow(0 0 5px #ffb400)}}
.info{border-radius:16px;padding:12px 14px;margin:10px 0;border:2px solid}
.info h4{margin:0 0 4px;font-size:1.1rem}
.info p{margin:0;line-height:1.4}
.info.good,.fb.good{background:#eafaf1;border-color:#9fe0bd}
.info.bad,.fb.bad{background:#fff0f1;border-color:#ffc0c4}
.chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:10px}
.chip{background:#f1f6fc;border:2px dashed #c5d9ef;border-radius:10px;padding:4px 8px;font-size:.85rem;color:var(--muted)}
.chip.on{background:#eafaf1;border:2px solid #9fe0bd;color:#17804b;font-weight:600}
.arr{color:#9bb3cf}
/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;color:var(--muted);flex-wrap:wrap}
.timer{background:var(--sky);padding:3px 12px;border-radius:99px;color:var(--navy)}
.timer.low{background:#ffe1e3;color:var(--red);animation:pulse .6s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.q{font-size:1.3rem;line-height:1.4;margin:6px 0 14px;color:var(--navy)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;background:#f6faff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:1.02rem;color:var(--ink);line-height:1.35;transition:transform .1s,border-color .15s}
.opt:hover:not(:disabled){border-color:var(--blue);transform:translateY(-2px)}
.opt.right{background:#dff7ea;border-color:var(--green);font-weight:600}
.opt.wrong{background:#ffe3e5;border-color:var(--red)}
.opt.dim{opacity:.55}
.fb{border:2px solid;border-radius:14px;padding:12px 14px;margin-top:14px;line-height:1.45}
/* sorter */
.cardzone{display:flex;justify-content:center;margin:6px 0 16px;min-height:110px}
.scard{background:#fff;border:3px solid var(--blue);border-radius:18px;padding:18px 22px;font-size:1.25rem;font-weight:600;text-align:center;max-width:520px;box-shadow:0 6px 0 #cfe3f7;display:flex;align-items:center;justify-content:center;color:var(--navy)}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.sorter{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bin{border:3px solid;border-radius:20px;padding:16px 10px;font-size:1.1rem;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .1s;color:var(--ink)}
.bin:active{transform:scale(.96)}
.bin .bicon{font-size:2rem}
.bin small{background:#fff;border-radius:99px;padding:1px 10px;font-weight:700}
.bin.in{background:#e6f4ff;border-color:#7fbaf5}
.bin.out{background:#fff0f5;border-color:#ffa9c6}
.bin.good{background:#eafaf1;border-color:#86d9ac}
.bin.bad{background:#fff0f1;border-color:#ffadb2}
/* model */
.model{width:100%;max-width:420px;display:block;margin:0 auto}
#mLungs{transform-box:fill-box;transform-origin:50% 0;transition:transform 1.3s ease}
.model.inhale #mLungs{transform:scale(1.1,1.13)}
#mDia{transform-box:fill-box;transform-origin:50% 100%;transition:transform 1.3s ease}
.model.inhale #mDia{transform:translateY(14px) scaleY(.4)}
#ribsL,#ribsR{transform-box:fill-box;transition:transform 1.3s ease}
#ribsL{transform-origin:100% 0}#ribsR{transform-origin:0 0}
.model.inhale #ribsL{transform:rotate(5deg) translateX(-5px)}
.model.inhale #ribsR{transform:rotate(-5deg) translateX(5px)}
#airIn,#airOut{transition:opacity .6s}
.model #airIn{opacity:0}.model.inhale #airIn{opacity:1}
.model #airOut{opacity:1}.model.inhale #airOut{opacity:0}
.state h3{margin:0 0 6px;color:var(--navy)}
.state ul{margin:0;padding-left:20px;line-height:1.6}
.gauge{margin-top:12px;font-size:.92rem;color:var(--muted)}
.gbar{position:relative;height:16px;border-radius:99px;background:#eef3f9;margin:4px 0;overflow:visible}
.gbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#7fbaf5,#2b7de9);transition:width 1.3s}
.gbar em{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--pink);border-radius:2px;left:50%}
/* arcade */
.hud{display:flex;gap:10px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.hud span{background:#fff;border:2px solid var(--line);border-radius:99px;padding:6px 16px;font-size:1.15rem;font-weight:600;color:var(--navy)}
.arena{position:relative;height:380px;border-radius:24px;overflow:hidden;box-shadow:0 6px 0 #cfe3f7;user-select:none;touch-action:manipulation;background:#fff}
.zone{position:absolute;left:0;right:0}
.zone.air{top:0;height:48%;background:radial-gradient(circle at 30% 30%,#f2f9ff,#cbe6ff)}
.zone.blood{bottom:0;height:48%;background:linear-gradient(180deg,#ffd9de,#ffb3bd);overflow:hidden}
.wallm{position:absolute;left:0;right:0;top:48%;height:4%;background:repeating-linear-gradient(90deg,#f4a3b4 0 22px,#e98aa0 22px 26px)}
.zlabel{position:absolute;left:12px;top:8px;font-weight:600;color:var(--navy);opacity:.6;font-size:.95rem;z-index:1}
.blood .zlabel{top:auto;bottom:8px;color:#8a1f33}
.rbc{position:absolute;width:52px;height:30px;border-radius:50%;background:radial-gradient(ellipse at center,#c8283f 0 30%,#e5485f 31% 100%);animation:flow 9s linear infinite;opacity:.85}
@keyframes flow{from{left:-15%}to{left:110%}}
.mol{position:absolute;width:56px;height:56px;margin-left:-4px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.05rem;cursor:pointer;z-index:3;animation:bob2 1.6s ease-in-out infinite,pop .3s ease;transition:transform .7s ease,opacity .7s ease;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.mol.static{position:relative;display:inline-grid;animation:none;width:46px;height:46px;cursor:default;vertical-align:middle;margin-right:6px}
.mol.o2{background:#2b7de9;color:#fff;border:3px solid #fff}
.mol.co2{background:#6b7280;color:#fff;border:3px solid #fff}
.mol.co{background:#1f2937;color:#ffcf4d;border:3px dashed #ffcf4d}
.mol.down{transform:translateY(165px) scale(.5);opacity:0}
.mol.up{transform:translateY(-165px) scale(.7);opacity:0}
.mol.bad{transform:scale(1.6);opacity:0}
.mol.fade{opacity:0;transform:scale(.4)}
@keyframes bob2{0%,100%{margin-top:0}50%{margin-top:-7px}}
.floatpt{position:absolute;z-index:5;font-weight:700;font-size:1.2rem;color:var(--green);pointer-events:none;animation:rise .8s ease forwards}
.floatpt.neg{color:var(--red)}
@keyframes rise{to{transform:translateY(-40px);opacity:0}}
.toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:#1f2937;color:#ffcf4d;padding:8px 14px;border-radius:12px;font-weight:600;z-index:6;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:90%}
.toast.on{opacity:1}
.arena.flash{animation:flash .4s}
@keyframes flash{50%{box-shadow:0 0 0 6px var(--red)}}
.tip{text-align:center;color:var(--muted);margin-top:10px}
.legend{display:grid;gap:10px;margin:8px 0 4px;font-size:1.02rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--sky);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.5rem;color:var(--navy)}
.explain{background:#fffbea;border:2px solid #ffe08a;border-radius:16px;padding:12px 14px;line-height:1.5}
/* equation */
.eq{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;font-size:1.5rem;font-weight:700;color:var(--navy);margin:10px 0}
.slot{min-width:96px;min-height:70px;border:3px dashed #a9c7e8;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 8px;background:#f6faff;color:#a9c7e8;font-size:1.4rem}
.slot.cur{border-color:var(--pink);background:#fff3f7;animation:pulse 1.2s infinite;color:var(--pink)}
.slot.filled{border-style:solid;border-color:var(--green);background:#eafaf1;color:var(--navy)}
.slot b,.token b{font-size:1.15rem}
.slot small,.token small{font-size:.78rem;font-weight:500;color:var(--muted)}
.eqlab{display:flex;justify-content:center;gap:40px;color:var(--muted);font-weight:600;margin-bottom:12px;flex-wrap:wrap}
.tokens{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.token{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 14px;display:flex;flex-direction:column;align-items:center;color:var(--navy);box-shadow:0 4px 0 #cfe3f7;min-width:92px}
.token:hover:not(:disabled){border-color:var(--blue)}
.token:disabled{opacity:.3;cursor:default}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* disease */
.patient{display:flex;gap:14px;align-items:flex-start;background:#f6faff;border-radius:18px;padding:14px;margin-bottom:12px}
.pav{font-size:3rem;background:#fff;border-radius:50%;width:76px;height:76px;display:grid;place-items:center;flex:0 0 auto;border:3px solid var(--line)}
.patient h3{margin:0 0 4px;color:var(--navy)}
.patient p{margin:0;line-height:1.5;font-size:1.05rem}
/* cert */
.cert{background:#fff;border:8px double #7fbaf5;border-radius:24px;padding:28px 20px;text-align:center;max-width:640px;margin:0 auto}
.cert h1{margin:6px 0;color:var(--navy);font-size:clamp(1.5rem,4vw,2.1rem)}
.cert .cname{font-size:clamp(1.6rem,5vw,2.4rem);color:var(--pink);margin:6px 0;border-bottom:3px dotted #a9c7e8;display:inline-block;padding:0 20px 4px}
input.name{font:inherit;font-size:1.2rem;padding:10px 14px;border-radius:12px;border:2px solid var(--line);width:100%;max-width:360px}
.confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@media print{header,.row,.foot{display:none!important}body{background:#fff}.cert{border-color:#2b7de9}}
@media(max-width:760px){.svgbox svg{max-height:50vh}}
@media(max-width:440px){.total{display:none}}
@media(max-width:520px){.lhead h2{font-size:1.2rem}.logo{font-size:1.1rem}.hbtn{padding:5px 9px;font-size:.85rem}.total{font-size:.85rem}.q{font-size:1.15rem}.scard{font-size:1.1rem}.arena{height:360px}}
</style>
</head>
<body>
<header>
  <div class="logo" onclick="home()">🫁 Breath<span>Quest</span></div>
  <span class="total" id="total"></span>
  <button class="hbtn lang" id="langBtn" onclick="toggleLang()" aria-label="Language"><b data-l="en">EN</b><b data-l="id">ID</b></button>
  <button class="hbtn" id="muteBtn" onclick="toggleMute()" aria-label="Sound">🔊</button>
</header>
<main id="app"></main>

<script>
/* =========================================================
   BreathQuest – Respiratory System Adventure (EN / ID)
   Single-file game. No external dependencies except a font.
   ========================================================= */
const $ = s => document.querySelector(s);
const app = $('#app');
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]} return a };
const rand = a => a[Math.random()*a.length|0];
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let A = {};            // current screen actions (used by inline onclick)
let screen = null;

/* ---------- storage ---------- */
const KEY='breathquest_v1';
let save = {stars:{}, best:{}, name:'', lang:'en', muted:false};
try{ Object.assign(save, JSON.parse(localStorage.getItem(KEY)||'{}')) }catch(e){}
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(save)) }catch(e){} }
let lang = save.lang==='id'?'id':'en';
let muted = !!save.muted;
const tx = o => (o && typeof o==='object' && !Array.isArray(o)) ? (o[lang] ?? o.en) : o;

/* ---------- UI text ---------- */
const UI = {
 welcomeTitle:{en:"Welcome to BreathQuest!",id:"Selamat datang di BreathQuest!"},
 welcomeSub:{en:"An adventure through the respiratory system",id:"Petualangan menjelajahi sistem pernapasan"},
 welcome:{en:"Woof! I’m <b>Bubble</b> 🐾 Take a deep breath… and let’s explore how your body breathes! Play the levels in order, collect ⭐ stars, and unlock your certificate.",id:"Guk! Aku <b>Bubble</b> 🐾 Tarik napas dalam-dalam… ayo jelajahi bagaimana tubuhmu bernapas! Mainkan level secara berurutan, kumpulkan ⭐ bintang, dan buka sertifikatmu."},
 level:{en:"Level",id:"Level"},
 getCert:{en:"Get your certificate",id:"Ambil sertifikatmu"},
 certHint:{en:"Finish all 6 levels to unlock your certificate! 🎓",id:"Selesaikan ke-6 level untuk membuka sertifikatmu! 🎓"},
 reset:{en:"Reset progress",id:"Atur ulang kemajuan"},
 resetQ:{en:"Erase all stars and scores?",id:"Hapus semua bintang dan skor?"},
 levelDone:{en:"Level complete!",id:"Level selesai!"},
 points:{en:"Points",id:"Poin"},
 pts:{en:"pts",id:"poin"},
 funFact:{en:"Fun fact:",id:"Fakta menarik:"},
 retry:{en:"Play again",id:"Main lagi"},
 next:{en:"Next level",id:"Level berikutnya"},
 menu:{en:"Menu",id:"Menu"},
 nextQ:{en:"Next",id:"Lanjut"},
 yay:{en:["Pawsome!","Great job!","Correct!","Brilliant!"],id:["Hebat!","Kerja bagus!","Benar!","Keren!"]},
 nope:{en:"Not quite!",id:"Belum tepat!"},
 timeUp:{en:"Time’s up!",id:"Waktu habis!"},
 question:{en:"Question",id:"Soal"},
 mistakes:{en:"Mistakes",id:"Kesalahan"},
 start:{en:"Start",id:"Mulai"},
 continue:{en:"Continue",id:"Lanjutkan"},
 step:{en:"Step",id:"Langkah"},
 clue:{en:"Clue",id:"Petunjuk"},
 airFirst:{en:"You breathe in through your nose. Tap the part where the air goes <b>first</b>.",id:"Kamu menghirup udara lewat hidung. Ketuk bagian yang <b>pertama</b> dilewati udara."},
 airNext:{en:"Where does the air go <b>next</b>?",id:"Ke mana udara mengalir <b>selanjutnya</b>?"},
 phaseB:{en:"🎉 You traced the whole air path! <b>Part 2:</b> read each clue and tap the matching part.",id:"🎉 Kamu berhasil menelusuri jalur udara! <b>Bagian 2:</b> baca petunjuknya lalu ketuk bagian yang sesuai."},
 allFound:{en:"You found them all! 🎉",id:"Kamu menemukan semuanya! 🎉"},
 tapHint:{en:"Tip: after 2 wrong taps, the right part will glow.",id:"Tips: setelah 2 kali salah, bagian yang benar akan bersinar."},
 youTapped:{en:"You tapped",id:"Kamu mengetuk"},
 inhale:{en:"Inhale (inspiration)",id:"Inspirasi (menghirup)"},
 exhale:{en:"Exhale (expiration)",id:"Ekspirasi (mengembuskan)"},
 breatheIn:{en:"⬇ Breathe in",id:"⬇ Tarik napas"},
 breatheOut:{en:"⬆ Breathe out",id:"⬆ Embuskan"},

/* ---------- Reusable: multiple-choice quiz ---------- */
function Quiz(qs, opt){
 const st={i:0, order:qs.map(q=>shuffle(q.o.map((_,k)=>k))), picked:null, correct:0, wrong:0, pts:0, hearts:opt.hearts||0, left:opt.timer||0, tid:null};
 function stopTimer(){ clearInterval(st.tid); st.tid=null }
 function startTimer(){ if(!opt.timer) return; stopTimer(); st.left=opt.timer; st.tid=setInterval(()=>{ st.left--; const e=$('#qt'); if(e){ e.textContent=st.left; e.parentElement.classList.toggle('low',st.left<=5) } if(st.left<=0) pick(-1) },1000) }
 function pick(k){ if(st.picked!==null) return; stopTimer(); st.picked=k; const q=qs[st.i];
  if(k===q.a){ st.correct++; st.pts+=10+(opt.timer?st.left:0); sfx.ok() } else { st.wrong++; if(opt.hearts) st.hearts--; sfx.bad() } draw() }
 function next(){ st.i++; st.picked=null; if(st.i>=qs.length||(opt.hearts&&st.hearts<=0)){ stopTimer(); opt.onDone(st); return } draw(); startTimer() }
 function draw(){
  A={pick,next};
  const q=qs[st.i], done=st.picked!==null, ok=st.picked===q.a, last=st.i===qs.length-1||(opt.hearts&&st.hearts<=0);
  app.innerHTML=`${opt.head()}<div class="panel">
   <div class="qtop"><span>${t('question')} ${st.i+1}/${qs.length}</span>
    ${opt.hearts?`<span>${'❤️'.repeat(Math.max(0,st.hearts))}${'🤍'.repeat(opt.hearts-Math.max(0,st.hearts))}</span>`:''}
    ${opt.timer?`<span class="timer ${st.left<=5&&!done?'low':''}">⏱ <b id="qt">${st.left}</b></span>`:''}</div>
   <div class="bar"><i style="width:${(st.i+(done?1:0))/qs.length*100}%"></i></div>
   <h3 class="q">${tx(q.q)}</h3>
   <div class="opts">${st.order[st.i].map(k=>`<button class="opt ${done?(k===q.a?'right':(k===st.picked?'wrong':'dim')):''}" ${done?'disabled':''} onclick="A.pick(${k})">${tx(q.o[k])}</button>`).join('')}</div>
   ${done?`<div class="fb ${ok?'good':'bad'}"><b>${ok?rand(t('yay')):(st.picked===-1?t('timeUp'):t('nope'))}</b> ${tx(q.e)}</div>
   ${opt.hearts&&st.hearts<=0?`<p class="hint"><b>${t('gameOver')}</b></p>`:''}
   <div class="row end"><button class="btn" onclick="A.next()">${last?'🏁 ':''}${t('nextQ')} ➜</button></div>`:''}
  </div>`;
 }
 return {draw, start(){ draw(); startTimer() }, cleanup:stopTimer, st};
}

/* ---------- Reusable: one-card-at-a-time sorter ---------- */
function Sorter(cards, bins, opt){
 const st={i:0, mistakes:0, fb:null, count:[0,0], order:shuffle(cards), lock:false};
 function choose(b){ if(st.lock) return; const c=st.order[st.i]; if(!c) return; const ok=c.b===b;
  ok?sfx.ok():(sfx.bad(),st.mistakes++); st.count[c.b]++; st.fb={ok,c}; st.i++;
  if(st.i>=st.order.length){ st.lock=true; draw(); setTimeout(()=>opt.onDone(st),1300) } else draw();
  if(!ok){ const z=$('.cardzone'); z&&z.classList.add('shake') } }
 function draw(){
  A={choose}; const c=st.order[st.i];
  app.innerHTML=`${opt.head()}<div class="panel">${guide(opt.prompt(), st.fb&&!st.fb.ok?'sad':'happy')}
   <div class="qtop"><span>${Math.min(st.i+1,st.order.length)}/${st.order.length}</span><span>${t('mistakes')}: ${st.mistakes}</span></div>
   <div class="bar"><i style="width:${st.i/st.order.length*100}%"></i></div>
   <div class="cardzone">${c?`<div class="scard pop">${tx(c.t)}</div>`:`<div class="scard pop">✅</div>`}</div>
   <div class="sorter">${bins.map((b,k)=>`<button class="bin ${b.cls}" onclick="A.choose(${k})" ${c?'':'disabled'}><div class="bicon">${b.icon}</div><b>${tx(b.label)}</b><small>${st.count[k]}</small></button>`).join('')}</div>
   ${st.fb?`<div class="fb ${st.fb.ok?'good':'bad'}"><b>${st.fb.ok?'✔ '+rand(t('yay')):'✘ '+t('nope')}</b> “${tx(st.fb.c.t)}” ${st.fb.ok?'':`— ${t('belongs')} <b>${tx(bins[st.fb.c.b].label)}</b>.`} ${st.fb.c.e?tx(st.fb.c.e):''}</div>`:''}
  </div>`;
 }
 return {draw, st};
}

function L1(){

 const target=()=>st.phase===0?PATH[st.step]:FIND[st.step].id;
 function tap(id){
  if(st.phase===2) return;
  if(id===target()){
   sfx.ok(); st.found.add(id); st.info={id,ok:true}; st.streak=0; st.step++; st.justB=false;
   const total=st.phase===0?PATH.length:FIND.length;
   if(st.step>=total){
    if(st.phase===0){ st.phase=1; st.step=0; st.found=new Set(); st.justB=true }
    else { st.phase=2; draw(); setTimeout(()=>finish(0, calcStars(st.mistakes,[2,5]), Math.max(10,130-st.mistakes*5)),1200); return }
   }
  } else { sfx.bad(); st.mistakes++; st.streak++; st.info={id,ok:false}; st.wrong=id }
  draw();
 }
 function draw(){
  A={tap};
  const tg=st.phase<2?target():null;
  let task;
  if(st.phase===0) task=`<b>${t('step')} ${st.step+1}/${PATH.length}</b> — ${tx(st.step===0?UI.airFirst:UI.airNext)}`;
  else if(st.phase===1) task=(st.justB?t('phaseB')+'<br><br>':'')+`<b>${t('clue')} ${st.step+1}/${FIND.length}</b> — ${tx(FIND[st.step].c)}`;
  else task=t('allFound');
  const info=st.info?`<div class="info ${st.info.ok?'good':'bad'}"><h4>${st.info.ok?'✔':'✘ '+t('youTapped')+':'} ${tx(PARTS[st.info.id].n)}</h4><p>${tx(PARTS[st.info.id].f)}</p></div>`:`<p class="hint">${t('tapHint')}</p>`;
  app.innerHTML=`${head(0,`${t('mistakes')}: ${st.mistakes}`)}
   <div class="two"><div class="svgbox">${anatomySVG()}</div>
   <div class="side"><div class="panel">${guide(task, st.info&&!st.info.ok?'sad':'happy')}${info}
    <div class="chips">${(st.phase===0?PATH:FIND.map(f=>f.id)).map((p,i)=>`<span class="chip ${(i<st.step||st.phase===2)?'on':''}">${(i<st.step||st.phase===2)?tx(PARTS[p].n):'?'}</span>`).join(st.phase===0?'<span class="arr">→</span>':'')}</div>

}

  app.innerHTML=`${head(1)}<div class="two"><div class="svgbox">${modelSVG(st.inhale)}</div>
   <div class="panel">${guide(t('modelIntro'))}
    <div class="row" style="justify-content:flex-start"><button class="btn" onclick="A.breathe(true)">${t('breatheIn')}</button><button class="btn pink" onclick="A.breathe(false)">${t('breatheOut')}</button><button class="btn ghost" id="autoBtn" onclick="A.auto()">${st.auto?t('stop'):t('auto')}</button></div>
    <div id="mside" style="margin-top:14px">${side()}</div>
    <div class="row end"><button class="btn green" id="mnext" onclick="A.toSort()" ${st.tried[0]&&st.tried[1]?'':'disabled'}>${t('toSort')}</button></div>
   </div></div>`;
 }
 show(scr);
}

/* =========================================================
   LEVEL 3 – Gas Exchange Rush (arcade)
   ========================================================= */
function L3(){
 const DUR=40;
 const st={stage:'intro', score:0, combo:0, maxCombo:0, left:DUR, o2:0, co2:0, co:0, tick:null, spawn:null, toastT:null};
 function stop(){ clearInterval(st.tick); clearTimeout(st.spawn); clearTimeout(st.toastT) }
 const mult=()=>Math.min(3,1+Math.floor(st.combo/5));
 function hud(){ const a=$('#hT'),b=$('#hS'),c=$('#hC'); if(a){a.textContent=st.left;b.textContent=st.score;c.textContent=mult()} }
 function floatPt(m,txt,neg){ const ar=$('#arena'); if(!ar) return; const f=document.createElement('div'); f.className='floatpt'+(neg?' neg':''); f.textContent=txt; f.style.left=m.style.left; f.style.top=m.style.top; ar.appendChild(f); setTimeout(()=>f.remove(),800) }
 function toast(msg){ const e=$('#toast'); if(!e) return; e.innerHTML=msg; e.classList.add('on'); clearTimeout(st.toastT); st.toastT=setTimeout(()=>e.classList.remove('on'),1600) }
 function hit(m,type){
  if(m._hit) return; m._hit=true; clearTimeout(m._t);
  if(type==='co'){ st.co++; st.combo=0; st.score=Math.max(0,st.score-15); sfx.bad(); m.classList.add('bad'); floatPt(m,'−15',true); toast(t('coWarn')); const ar=$('#arena'); ar.classList.remove('flash'); void ar.offsetWidth; ar.classList.add('flash') }
  else { st.combo++; st.maxCombo=Math.max(st.maxCombo,st.combo); const p=10*mult(); st.score+=p; type==='o2'?st.o2++:st.co2++; sfx.pop(); floatPt(m,'+'+p); m.classList.add(type==='o2'?'down':'up') }
  setTimeout(()=>m.remove(),700); hud();
 }
 function spawn(){
  const ar=$('#arena'); if(!ar||st.stage!=='play') return;
  const el=DUR-st.left, r=Math.random(), type=r<.45?'o2':r<.84?'co2':'co';
  const m=document.createElement('div'); m.className='mol '+type; m.textContent=type==='o2'?'O₂':type==='co2'?'CO₂':'CO';
  m.style.left=(3+Math.random()*80)+'%'; m.style.top=(type==='co2'? 58+Math.random()*26 : 5+Math.random()*28)+'%';
  m.addEventListener('pointerdown',e=>{e.preventDefault(); hit(m,type)});
  ar.appendChild(m);
  m._t=setTimeout(()=>{ if(m._hit) return; m._hit=true; m.classList.add('fade'); if(type!=='co'){ st.combo=0; hud() } setTimeout(()=>m.remove(),500) }, 3000-Math.min(1100,el*28));
  st.spawn=setTimeout(spawn, Math.max(360,820-el*12)*(.7+Math.random()*.6));
 }
 function start(){ st.stage='play'; Object.assign(st,{score:0,combo:0,maxCombo:0,left:DUR,o2:0,co2:0,co:0}); draw(); spawn();
  st.tick=setInterval(()=>{ st.left--; hud(); if(st.left<=0){ stop(); st.stage='result'; sfx.win(); draw() } },1000) }
 function cont(){ finish(2, st.score>=320?3:st.score>=180?2:1, st.score) }
 function draw(){
  A={start,cont};
  if(st.stage==='play'&&$('#arena')){ applyT(); return }
  if(st.stage==='intro'){
   app.innerHTML=`${head(2)}<div class="panel">${guide(t('gxIntro'))}
    <div class="legend"><div><span class="mol o2 static">O₂</span>${t('lgO2')}</div><div><span class="mol co2 static">CO₂</span>${t('lgCO2')}</div><div><span class="mol co static">CO</span>${t('lgCO')}</div></div>
    <div class="row end"><button class="btn big green" onclick="A.start()">▶ ${t('start')}</button></div></div>`;
  } else if(st.stage==='play'){
   app.innerHTML=`${head(2)}<div class="hud"><span>⏱ <b id="hT">${st.left}</b></span><span>⭐ <b id="hS">${st.score}</b></span><span>🔥 ×<b id="hC">${mult()}</b></span></div>
    <div class="arena" id="arena"><div class="zone air"><span class="zlabel" data-t="zAir"></span></div><div class="wallm"></div>
    <div class="zone blood"><span class="zlabel" data-t="zBlood"></span>${[0,1,2,3,4,5,6].map(i=>`<div class="rbc" style="animation-delay:${-i*1.3}s;top:${[18,48,30,62,22,52,38][i]}%"></div>`).join('')}</div>
    <div id="toast" class="toast"></div></div><p class="tip" data-t="gxTip"></p>`;
   applyT();
  } else {
   const s=st.score>=320?3:st.score>=180?2:1;
   app.innerHTML=`${head(2)}<div class="panel">${guide(t('gxDone'))}
    <div class="center bigstars">${starsHTML(s)}</div>
    <div class="stats"><div class="stat"><b>${st.score}</b>${t('points')}</div><div class="stat"><b>${st.o2}</b>${t('stO2')}</div><div class="stat"><b>${st.co2}</b>${t('stCO2')}</div><div class="stat"><b>${st.co}</b>${t('stCO')}</div><div class="stat"><b>${st.maxCombo}</b>${t('stCombo')}</div></div>
    <div class="explain">${t('gxExplain')}</div>
    <div class="row"><button class="btn ghost" onclick="A.start()">🔁 ${t('retry')}</button><button class="btn" onclick="A.cont()">${t('continue')} ➜</button></div></div>`;
  }
 }
 show({draw, cleanup:stop});
}

/* =========================================================
   LEVEL 4 – Metabolism: The Energy Lab
   ========================================================= */
function L4(){
 const R=['glu','o2'], P=['co2','h2o','atp'];
 const st={stage:'eq', slots:[null,null,null,null,null], mist:0, fb:null, toks:shuffle(Object.keys(TOKENS))};
 let quiz;
 const cur=()=>st.slots.indexOf(null);
 const tok=k=>`<b>${TOKENS[k].f}</b><small>${tx(TOKENS[k].n)}</small>`;
 function tap(k){
  const c=cur(); if(c<0||st.slots.includes(k)) return;
  const side=c<2?R:P;
  if(side.includes(k)){ st.slots[c]=k; sfx.ok(); st.fb=cur()<0?{done:true}:{ok:true,k} }
  else { st.mist++; sfx.bad(); st.fb={ok:false,k,c} }
  draw();
  if(st.fb&&st.fb.ok===false){ const e=document.querySelector(`.token[data-k="${k}"]`); e&&e.classList.add('shake') }
 }
 function toQuiz(){ st.stage='quiz'; quiz=Quiz(Q4,{head:()=>head(3),onDone(q){ finish(3, calcStars(st.mist+q.wrong,[1,3]), Math.max(0,50-st.mist*5)+q.correct*10) }}); quiz.start() }
 function fbHTML(){
  const f=st.fb; if(!f) return '';
  if(f.done) return `<div class="fb good">${t('eqDone')}</div><div class="row end"><button class="btn green" onclick="A.toQuiz()">${t('toQuiz')}</button></div>`;
  if(f.ok) return `<div class="fb good">✔ <b>${TOKENS[f.k].f}</b> (${tx(TOKENS[f.k].n)}) — ${rand(t('yay'))}</div>`;
  const why=TOKENS[f.k].why?tx(TOKENS[f.k].why):(P.includes(f.k)&&f.c<2?t('isProduct'):t('isReactant'));
  return `<div class="fb bad">✘ <b>${TOKENS[f.k].f}</b> — ${why}</div>`;
 }
 function draw(){
  if(st.stage==='quiz') return quiz.draw();
  A={tap,toQuiz};
  const c=cur(), slot=i=>`<div class="slot ${st.slots[i]?'filled':''} ${i===c?'cur':''}">${st.slots[i]?tok(st.slots[i]):'?'}</div>`;
  app.innerHTML=`${head(3,`${t('mistakes')}: ${st.mist}`)}<div class="panel">${guide(t('eqIntro'), st.fb&&st.fb.ok===false?'sad':'happy')}
   <div class="eq">${slot(0)}<span>+</span>${slot(1)}<span style="color:var(--pink)">⟶</span>${slot(2)}<span>+</span>${slot(3)}<span>+</span>${slot(4)}</div>
   <div class="eqlab"><span>${t('reactants')}</span><span>${t('products')}</span></div>
   <div class="tokens">${st.toks.map(k=>`<button class="token" data-k="${k}" onclick="A.tap('${k}')" ${st.slots.includes(k)||c<0?'disabled':''}>${tok(k)}</button>`).join('')}</div>
   ${fbHTML()}</div>`;
 }
 show({draw, cleanup(){ quiz&&quiz.cleanup() }});
}

/* =========================================================
   LEVEL 5 – Diseases: Lung Detective
   ========================================================= */
function L5(){
 const cases=shuffle(CASES);
 const st={stage:'case', i:0, picked:null, mist:0, correct:0,
  opts:cases.map(c=>shuffle([c.d,...shuffle(Object.keys(DIS).filter(k=>k!==c.d)).slice(0,3)]))};
 let sorter;
 function pick(k){ if(st.picked) return; st.picked=k; const ok=k===cases[st.i].d; ok?(sfx.ok(),st.correct++):(sfx.bad(),st.mist++); draw() }
 function next(){ st.i++; st.picked=null;
  if(st.i>=cases.length){ st.stage='sort';
   sorter=Sorter(HEALTH,[{label:UI.helps,icon:'💚',cls:'good'},{label:UI.harms,icon:'💔',cls:'bad'}],{head:()=>head(4),prompt:()=>t('healthIntro'),onDone(s){
    finish(4, calcStars(st.mist+s.mistakes,[1,3]), st.correct*10+(HEALTH.length-s.mistakes)*10) }});
  }
  draw() }
 function draw(){
  if(st.stage==='sort') return sorter.draw();
  A={pick,next};
  const c=cases[st.i], done=!!st.picked, ok=st.picked===c.d;
  app.innerHTML=`${head(4,`${t('mistakes')}: ${st.mist}`)}<div class="panel">
   ${st.i===0&&!done?guide(t('detIntro')):''}
   <div class="qtop"><span>🩺 ${t('patient')} ${st.i+1}/${cases.length}</span></div>
   <div class="bar"><i style="width:${(st.i+(done?1:0))/cases.length*100}%"></i></div>
   <div class="patient"><div class="pav">${c.av}</div><div><h3>${c.nm}</h3><p>${tx(c.s)}</p></div></div>
   <h3 class="q">${t('diagnose')}</h3>
   <div class="opts">${st.opts[st.i].map(k=>`<button class="opt ${done?(k===c.d?'right':(k===st.picked?'wrong':'dim')):''}" ${done?'disabled':''} onclick="A.pick('${k}')">${tx(DIS[k].n)}</button>`).join('')}</div>
   ${done?`<div class="fb ${ok?'good':'bad'}"><b>${ok?rand(t('yay')):t('nope')}</b><br>${tx(DIS[c.d].i)}</div><div class="row end"><button class="btn" onclick="A.next()">${t('nextQ')} ➜</button></div>`:''}
  </div>`;
 }
 show({draw});
}

/* =========================================================
   LEVEL 6 – Final Challenge
   ========================================================= */
function L6(){
 let quiz=null;
 function go(){ quiz=Quiz(shuffle(POOL).slice(0,12),{timer:20,hearts:3,head:()=>head(5),onDone(q){ finish(5, q.correct>=11?3:q.correct>=8?2:1, q.pts) }}); scr.draw=quiz.draw; scr.cleanup=quiz.cleanup; quiz.start() }
 const scr={draw(){ A={go}; app.innerHTML=`${head(5)}<div class="panel">${guide(t('finalIntro'))}<div class="row end"><button class="btn big green" onclick="A.go()">▶ ${t('start')}</button></div></div>` }, cleanup(){}};
 show(scr);
}

/* ---------- Certificate ---------- */
function certificate(){
 show({draw(){
  A={make(){ const v=$('#cname').value.trim(); if(!v) return; save.name=v.slice(0,40); persist(); sfx.win(); confetti(); this_draw() }, edit(){ save.name=''; persist(); this_draw() }};
  const stars=Object.values(save.stars).reduce((a,b)=>a+b,0), pts=Object.values(save.best).reduce((a,b)=>a+b,0);
  const date=new Date().toLocaleDateString(lang==='id'?'id-ID':'en-GB',{day:'numeric',month:'long',year:'numeric'});
  if(!save.name){
   app.innerHTML=`<div class="panel center">${guide(t('enterName'))}<input class="name" id="cname" maxlength="40" placeholder="…"><div class="row"><button class="btn pink" onclick="A.make()">🎓 ${t('make')}</button><button class="btn ghost" onclick="home()">🏠 ${t('menu')}</button></div></div>`;
   const i=$('#cname'); i.focus(); i.addEventListener('keydown',e=>{ if(e.key==='Enter') A.make() });
  } else {
   app.innerHTML=`<div class="cert"><div style="font-size:3rem">🫁🏅</div><h1>${t('certTitle')}</h1><p>${t('certGiven')}</p>
    <div class="cname">${esc(save.name)}</div><p style="line-height:1.5">${t('certFor')}</p>
    <div style="font-size:1.4rem;font-weight:700;color:var(--navy)">⭐ ${stars}/18 · ${pts} ${t('pts')}</div>
    <div style="display:flex;justify-content:center;margin-top:8px">${bubbleSVG('happy',90)}</div>
    <p style="margin:0;color:var(--muted)">${t('signed')}<br>${date}</p></div>
    <div class="row"><button class="btn" onclick="window.print()">${t('print')}</button><button class="btn ghost" onclick="A.edit()">${t('changeName')}</button><button class="btn ghost" onclick="home()">🏠 ${t('menu')}</button></div>`;
  }
 }});
 function this_draw(){ screen.draw() }
}
